name: Deploy to Sakura

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# デプロイの同時実行を防ぐ（途中キャンセルはしない）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # さくらレンタルサーバ www/lp/ へ FTPS で転送する（lftp、削除同期なし）。
      # FTPログイン直下はアカウントのホームで、ドキュメントルートは www/。
      # 以前使っていた FTP-Deploy-Action は、転送先に同名ファイルがあると
      # ディレクトリ作成に失敗しても www/ 直下へ黙って転送する挙動があったため
      # 使わない（2026-10-30 の事故の原因）。
      - name: Deploy via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null 2>&1 || true
          # 転送先ディレクトリの用意（既にあればエラーになるが無視する）
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set dns:order inet;
            set net:max-retries 2;
            set net:timeout 30;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mkdir www/lp;
            bye;
          " || true
          # 本転送（失敗したらジョブも失敗にする）
          lftp -e "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set dns:order inet;
            set net:max-retries 2;
            set net:timeout 30;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror -R --verbose ./dist/ www/lp/;
            cls -la www/lp;
            bye;
          "
