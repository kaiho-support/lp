name: FTP diagnostics (temporary, incident recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect server layout with lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null 2>&1 || true
          echo "===== variant 1: FTPS explicit, IPv4 first ====="
          lftp -e "
            debug 5;
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set dns:order inet;
            set net:max-retries 1;
            set net:timeout 25;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            pwd;
            ls -la;
            cd www;
            pwd;
            ls -la;
            cd lp;
            pwd;
            ls -la;
            bye;
          " || true
          echo "===== variant 2: same but from login dir, list www/lp directly ====="
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set dns:order inet;
            set net:max-retries 1;
            set net:timeout 25;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            ls -la www/lp;
            ls -la lp;
            bye;
          " || true
