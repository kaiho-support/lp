name: FTP diagnostics (temporary, incident recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look for original index.html backups on server (read-only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null 2>&1 || true
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set dns:order inet;
            set net:max-retries 1;
            set net:timeout 25;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            echo === archive ===;
            cls -la archive;
            echo === db_backup ===;
            cls -la db_backup;
            echo === work ===;
            cls -la work;
            echo === home lp dir ===;
            cls -la lp;
            echo === www assets ===;
            cls -la www/assets;
            cls -la www/assets/img;
            echo === htaccess ===;
            cat www/.htaccess;
            bye;
          " || true
