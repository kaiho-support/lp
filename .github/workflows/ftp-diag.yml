name: FTP diagnostics (temporary, incident recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List cleanup archive contents (read-only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null 2>&1 || true
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set dns:order inet;
            set net:max-retries 1;
            set net:timeout 25;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            echo === cleanup top ===;
            cls -la archive/2026-10-22_cleanup;
            echo === cleanup recursive ===;
            find archive/2026-10-22_cleanup;
            echo === www assets img ===;
            cls -la www/assets/img;
            bye;
          " || true
