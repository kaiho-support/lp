name: FTP diagnostics (temporary, incident recovery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect server layout with lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          which lftp || (sudo apt-get update && sudo apt-get install -y lftp)
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set net:max-retries 1;
            set net:timeout 30;
            debug 4;
            pwd;
            ls -la;
            cd www;
            pwd;
            ls -la;
            cd lp;
            pwd;
            ls -la;
            bye;
          " "$FTP_SERVER" || true
